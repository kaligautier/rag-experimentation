services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: secret
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies src/liquibase on every `docker compose up`, then exits.
  liquibase:
    image: liquibase/liquibase:4.33
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/liquibase:/liquibase/changelog:ro
    working_dir: /liquibase/changelog
    command:
      - --url=jdbc:postgresql://postgres:5432/rag_db
      - --username=rag_user
      - --password=secret
      - --changelog-file=db.changelog-master.yaml
      - update
      - -Drag.embedding.dimensions=${RAG_EMBEDDING_DIMENSIONS:-3072}

volumes:
  postgres_data:
    driver: local
